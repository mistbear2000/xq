<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XQ監測設定</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<script>window.msal || document.write('<script src="https://unpkg.com/@azure/msal-browser@2/lib/msal-browser.min.js"><\/script>');</script>
<script>if (!window.msal) alert("登入程式庫載入失敗，請檢查網路或稍後再試");</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", sans-serif; max-width: 680px; margin: 0 auto; padding: 12px; background: #f5f6f8; color: #222; }
  h2 { margin: 8px 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font-size: 17px; padding: 10px 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text] { font-size: 20px; padding: 10px; width: 140px; border: 1px solid #ccc; border-radius: 8px; }
  select { font-size: 17px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  select.op { width: 80px; }
  select.thr { flex: 1; min-width: 150px; }
  #status { font-size: 14px; color: #666; margin-top: 6px; }
  .title { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
  .group { padding: 10px 0; border-bottom: 1px solid #eee; }
  .group .glabel { font-size: 15px; color: #555; margin-bottom: 6px; }
  .muted { color: #999; }
  .warn { color: #c5221f; }
  .ok { color: #188038; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 8px 4px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #eef4ff; }
  .code { font-weight: bold; color: #1a73e8; }
  .tablewrap { overflow-x: auto; }
  #log { white-space: pre-wrap; font-size: 13px; color: #c5221f; }
  #saveMsg { margin-top: 10px; font-size: 16px; }
</style>
</head>
<body>

<h2>XQ監測設定</h2>

<div class="card">
  <div class="row"><span id="user">尚未登入</span></div>
  <div class="row" style="margin-top:8px">
    <button id="btnLogin" class="primary">登入 Microsoft</button>
    <button id="btnReload" disabled>重新讀取</button>
    <button id="btnLogout" disabled>登出</button>
  </div>
  <div id="status"></div>
  <div id="log"></div>
</div>

<div class="card">
  <div class="row">
    <input type="text" id="code" placeholder="期股代號" inputmode="numeric">
    <button id="btnQuery" class="primary" disabled>查詢</button>
  </div>
  <div id="result" style="margin-top:10px"></div>
</div>

<div class="card">
  <b>監控清單</b> <span id="count" class="muted"></span>
  <div class="tablewrap">
    <table style="margin-top:8px">
      <thead><tr><th>股票</th><th>條件1</th><th>條件2</th><th>條件3</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script>
const CLIENT_ID = "ca3f7074-4879-4adb-9aa0-99762db21645";
const REDIRECT_URI = "https://mistbear2000.github.io/xq/";
const SCOPES = ["Files.ReadWrite", "User.Read"];
const FILE_PATH = "XQSettings/" + encodeURIComponent("監控設定.xlsx");

const app = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: "https://login.microsoftonline.com/consumers", redirectUri: REDIRECT_URI },
  cache: { cacheLocation: "localStorage" }
});

const $ = id => document.getElementById(id);
let stocks = [];
let options = { ops: [], thr: [] };
let names = new Map();

function setStatus(s) { $("status").textContent = s; }
function showError(s) { $("log").textContent = s; }
function cellText(v) { return (v === null || v === undefined) ? "" : String(v).trim(); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function nameOf(code) { return names.get(code) || ""; }
function label(code) { return code + nameOf(code); }

async function getToken() {
  const acc = app.getActiveAccount();
  try {
    return (await app.acquireTokenSilent({ scopes: SCOPES, account: acc })).accessToken;
  } catch (e) {
    await app.acquireTokenRedirect({ scopes: SCOPES });
    return null;
  }
}

function sheetUrl(sheet) {
  return "https://graph.microsoft.com/v1.0/me/drive/root:/" + FILE_PATH +
         ":/workbook/worksheets('" + encodeURIComponent(sheet) + "')";
}

async function graphGet(url) {
  const token = await getToken();
  if (!token) throw new Error("需要重新登入");
  const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error("HTTP " + res.status + "：" + (await res.text()).slice(0, 200));
  return res.json();
}

async function graphSend(method, url, body) {
  const token = await getToken();
  if (!token) throw new Error("需要重新登入");
  const res = await fetch(url, {
    method: method,
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("HTTP " + res.status + "：" + (await res.text()).slice(0, 200));
  return res.status === 204 ? null : res.json();
}

async function loadAll() {
  showError("");
  setStatus("讀取中...");
  $("btnReload").disabled = true;
  try {
    const [watch, opt, nm] = await Promise.all([
      graphGet(sheetUrl("監控清單") + "/usedRange?$select=values,rowIndex"),
      graphGet(sheetUrl("選項") + "/usedRange?$select=values"),
      graphGet(sheetUrl("股票名稱") + "/usedRange?$select=values")
    ]);

    names = new Map();
    nm.values.slice(1).forEach(r => {
      const c = cellText(r[0]);
      if (c) names.set(c, cellText(r[1]));
    });

    const startRow = (watch.rowIndex || 0) + 1;
    stocks = [];
    watch.values.forEach((r, i) => {
      if (i === 0) return;
      const code = cellText(r[0]);
      if (!code) return;
      stocks.push({
        excelRow: startRow + i,
        code: code,
        c: [cellText(r[1]), cellText(r[3]), cellText(r[5])],
        t: [cellText(r[2]), cellText(r[4]), cellText(r[6])]
      });
    });

    options.ops = opt.values.slice(1).map(r => cellText(r[0])).filter(x => x);
    options.thr = opt.values.slice(1).map(r => cellText(r[1])).filter(x => x);

    renderList();
    setStatus("已讀取 " + stocks.length + " 檔，" + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("");
    showError("讀取失敗：" + e.message);
  }
  $("btnReload").disabled = false;
}

function groupText(s, g) {
  return (s.c[g] || s.t[g]) ? (s.c[g] + " " + s.t[g]) : "";
}

function renderList() {
  $("count").textContent = "（" + stocks.length + " 檔）";
  $("list").innerHTML = stocks.map(s =>
    "<tr data-code='" + esc(s.code) + "'>" +
    "<td class='code'>" + esc(label(s.code)) + "</td>" +
    [0, 1, 2].map(g => "<td>" + (esc(groupText(s, g)) || "<span class='muted'>—</span>") + "</td>").join("") +
    "</tr>"
  ).join("");
  $("list").querySelectorAll("tr").forEach(tr => {
    tr.onclick = () => {
      $("code").value = tr.dataset.code;
      query();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });
}

function selectHtml(id, cls, list, cur) {
  const opts = [""].concat(list);
  if (cur && opts.indexOf(cur) < 0) opts.push(cur);
  return "<select id='" + id + "' class='" + cls + "'>" +
    opts.map(o => "<option value='" + esc(o) + "'" + (o === cur ? " selected" : "") + ">" +
                  (o ? esc(o) : "（無）") + "</option>").join("") +
    "</select>";
}

function query() {
  const code = $("code").value.trim();
  if (!code) { $("result").innerHTML = ""; return; }
  const s = stocks.find(x => x.code === code);
  if (!s) {
    if (names.has(code)) {
      $("result").innerHTML = "<div class='title'>" + esc(label(code)) + "</div>" +
                              "<div class='muted'>目前不在監控清單中</div>";
    } else {
      $("result").innerHTML = "<div class='warn'>查無此代號：" + esc(code) + "</div>";
    }
    return;
  }
  $("result").innerHTML =
    "<div class='title'>" + esc(label(s.code)) + "</div>" +
    [0, 1, 2].map(g =>
      "<div class='group'><div class='glabel'>條件組" + (g + 1) + "</div><div class='row'>" +
      selectHtml("op" + g, "op", options.ops, s.c[g]) +
      selectHtml("thr" + g, "thr", options.thr, s.t[g]) +
      "</div></div>"
    ).join("") +
    "<div class='row' style='margin-top:12px'><button id='btnSave' class='primary'>儲存修改</button></div>" +
    "<div id='saveMsg'></div>";
  $("btnSave").onclick = () => saveEdit(s);
}

async function saveEdit(s) {
  const msg = t => { $("saveMsg").innerHTML = t; };
  const vals = [];
  for (let g = 0; g < 3; g++) {
    const op = $("op" + g).value;
    const thr = $("thr" + g).value;
    if ((op && !thr) || (!op && thr)) {
      msg("<span class='warn'>條件組" + (g + 1) + "：比較符號和門檻值要一起設定，或一起選「（無）」</span>");
      return;
    }
    vals.push(op, thr);
  }
  const old = [s.c[0], s.t[0], s.c[1], s.t[1], s.c[2], s.t[2]];
  if (vals.every((v, i) => v === old[i])) {
    msg("<span class='muted'>沒有變更</span>");
    return;
  }

  $("btnSave").disabled = true;
  msg("儲存中...");
  try {
    const r = s.excelRow;
    const chk = await graphGet(sheetUrl("監控清單") + "/range(address='A" + r + "')?$select=values");
    if (cellText(chk.values[0][0]) !== s.code) {
      msg("<span class='warn'>雲端資料已被其他裝置變動，為避免改錯股票，請按「重新讀取」後再修改</span>");
      $("btnSave").disabled = false;
      return;
    }
    await graphSend("PATCH", sheetUrl("監控清單") + "/range(address='B" + r + ":G" + r + "')", { values: [vals] });
    await loadAll();
    query();
    $("saveMsg").innerHTML = "<span class='ok'>✔ 已儲存！本機約 30 秒內自動套用，Discord 會收到【設定更新】通知</span>";
  } catch (e) {
    msg("<span class='warn'>儲存失敗：" + esc(e.message) + "</span>");
    $("btnSave").disabled = false;
  }
}

function showUser(acc) {
  $("user").textContent = "已登入：" + acc.username;
  $("btnLogin").style.display = "none";
  $("btnReload").disabled = false;
  $("btnLogout").disabled = false;
  $("btnQuery").disabled = false;
}

$("btnLogin").onclick = () => app.loginRedirect({ scopes: SCOPES });
$("btnLogout").onclick = () => app.logoutRedirect();
$("btnReload").onclick = async () => { await loadAll(); if ($("code").value.trim()) query(); };
$("btnQuery").onclick = query;
$("code").addEventListener("keydown", e => { if (e.key === "Enter") query(); });

(async () => {
  try {
    const r = await app.handleRedirectPromise();
    if (r && r.account) app.setActiveAccount(r.account);
    const acc = app.getActiveAccount() || app.getAllAccounts()[0];
    if (acc) {
      app.setActiveAccount(acc);
      showUser(acc);
      loadAll();
    }
  } catch (e) {
    showError("登入錯誤：" + e.message);
  }
})();
</script>
</body>
</html>
